<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      border-radius: 20px;
      margin-bottom: 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    .bar-wrap {
      width: 120px;
      height: 3px;
      background: #e9ecef;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      background: #3b5bdb;
      border-radius: 3px;
      animation: fill 2.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes fill {
      0%   { width: 0%; }
      60%  { width: 75%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <img class="logo" src="/assets/img/logo.jpg" alt="Logo" draggable="false" />
  <div class="bar-wrap">
    <div class="bar"></div>
  </div>
</body>
</html>
