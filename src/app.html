<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/assets/img/logo.jpg" />
	<meta name="viewport" content="width=device-width" />
	%sveltekit.head%
	<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&display=swap" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.34.1/tabler-icons.min.css" rel="stylesheet" />
	<meta name="robots" content="nofollow, noindex" />
	<style>
		@media print {
			body {
				background-color: #fff !important;
				margin: 0;
				padding: 0;
			}
		}

		/* ── Splash Screen ───────────────────────────────────── */
		#splash {
			position: fixed;
			inset: 0;
			z-index: 99999;
			background: #ffffff;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			user-select: none;
			padding: 0 10px;

			transition: opacity 0.4s ease, visibility 0.4s ease;
		}

		#splash.hide {
			opacity: 0;
			visibility: hidden;
		}

		#splash img {
			width: 140px;
			height: 80px;
			object-fit: contain;
			display: block;
			margin-bottom: 28px;
		}

		#splash-bar-wrap {
			width: 120px;
			height: 3px;
			background: #e9ecef;
			border-radius: 3px;
			overflow: hidden;
		}

		#splash-bar {
			height: 100%;
			background: #3b5bdb;
			border-radius: 3px;
			animation: splash-fill 2.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
		}

		@keyframes splash-fill {
			0% {
				width: 0%;
			}

			60% {
				width: 75%;
			}

			100% {
				width: 100%;
			}
		}
	</style>
	<script>
		// Fix: WebView2 on Windows doesn't forward keyboard events until
		// the document has received explicit focus.
		(function () {
			function fixFocus() {
				window.focus();
				if (document.body) {
					document.body.setAttribute('tabindex', '-1');
					document.body.focus();
					document.body.removeAttribute('tabindex');
				}
			}
			fixFocus();
			document.addEventListener('DOMContentLoaded', fixFocus);
			window.addEventListener('load', function () {
				setTimeout(fixFocus, 200);
			});
		})();

		// Hide splash — called by SvelteKit onMount, or by the fallback timer below
		window.hideSplash = function () {
			var el = document.getElementById('splash');
			if (!el || el.dataset.hiding) return;
			el.dataset.hiding = '1';
			el.classList.add('hide');
			setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 450);
		};

		// Remove stale splash_logo key that used to override the logo src
		try { localStorage.removeItem('splash_logo'); } catch (e) { }

		// Guaranteed fallback: always hide after 3 s even if SvelteKit onMount
		// doesn't fire (e.g. route error, slow network in dev mode).
		setTimeout(window.hideSplash, 3000);
	</script>
</head>

<body data-sveltekit-preload-data="hover">

	<!-- Splash screen — shown until SvelteKit finishes mounting -->
	<div id="splash">
		<img id="splash-logo" src="/assets/img/logo.jpg" alt="Elly Fish" draggable="false" />
		<div id="splash-bar-wrap">
			<div id="splash-bar"></div>
		</div>
	</div>
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
