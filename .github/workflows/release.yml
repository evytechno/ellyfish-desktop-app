name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "VITE_PUBLIC_API_URL=${{ secrets.VITE_PUBLIC_API_URL }}" > .env
          echo "VITE_PUBLIC_ATTACHMENT_URL=${{ secrets.VITE_PUBLIC_API_URL }}" >> .env
          echo "VITE_PUBLIC_HMAC_WEBAPP_SECRET=${{ secrets.VITE_PUBLIC_HMAC_WEBAPP_SECRET }}" >> .env
          echo "VITE_PUBLIC_STORE_API_URL=${{ secrets.VITE_PUBLIC_STORE_API_URL }}" >> .env
          echo "VITE_PUBLIC_WORKSHOP_API_URL=${{ secrets.VITE_PUBLIC_WORKSHOP_API_URL }}" >> .env
          echo "VITE_PUBLIC_WORKSHOP_IMAGE_URL=${{ secrets.VITE_PUBLIC_WORKSHOP_IMAGE_URL }}" >> .env
          echo "TAURI_PRIVATE_KEY=${{ secrets.TAURI_PRIVATE_KEY }}" >> .env
          echo "TAURI_KEY_PASSWORD=${{ secrets.TAURI_KEY_PASSWORD }}" >> .env

      - name: Get version from tauri.conf.json
        id: version
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).package.version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Pre-download NSIS tauri utils (with retry)
        shell: pwsh
        run: |
          $url = "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.4.1/nsis_tauri_utils.dll"
          $dest = "$env:LOCALAPPDATA\tauri\NSIS\Plugins\x86-unicode\nsis_tauri_utils.dll"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          $maxRetries = 5
          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              Write-Host "Attempt $i of $maxRetries..."
              Invoke-WebRequest -Uri $url -OutFile $dest -TimeoutSec 120
              Write-Host "Download succeeded."
              break
            } catch {
              Write-Host "Attempt $i failed: $_"
              if ($i -eq $maxRetries) { exit 1 }
              Start-Sleep -Seconds (15 * $i)
            }
          }

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.VERSION }}
          releaseName: 'Elly Fish v${{ steps.version.outputs.VERSION }}'
          releaseBody: |
            ## Elly Fish v${{ steps.version.outputs.VERSION }}

            Download the installer below to update.
          releaseDraft: false
          prerelease: false

      - name: Commit latest.json to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"

          # Find the .nsis.zip.sig file generated by the build
          $sigFile = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.nsis.zip.sig" | Select-Object -First 1
          if (-not $sigFile) { Write-Error "No .sig file found"; exit 1 }

          $signature = (Get-Content $sigFile.FullName -Raw).Trim()
          $zipName   = ($sigFile.Name -replace '\.sig$', '').Replace(' ', '.')
          $downloadUrl = "https://github.com/evytechno/ellyfish-desktop-app/releases/download/v$version/$zipName"
          $pubDate = (Get-Date -Format "yyyy-MM-ddTHH:mm:ss.fffZ")

          $latestJson = [ordered]@{
            version  = $version
            notes    = "## Elly Fish v$version`n`nDownload the installer below to update."
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 5

          $latestJson | Out-File -FilePath "latest.json" -Encoding utf8NoBOM

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --staged --quiet || git commit -m "chore: update latest.json for v$version [skip ci]"
          git push
